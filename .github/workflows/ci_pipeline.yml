  # Check if both Frontend and Backend Docker images are built and push Docker images to Docker Hub
  build_and_push_docker_images:
    name: Verify Docker images and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build_frontend_docker_image_and_scan_for_vulnerabilities] # build_backend_docker_image_and_scan_for_vulnerabilities,
    permissions:
      packages: write

    steps:
      # checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify both Docker images were pushed successfully
      - name:
          Verify Docker images push
          # echo "Verifying Backend image..."
          # docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/portfolio_backend:${{ github.ref_name }} || \
          # docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/portfolio_backend:${{ github.ref_name }}-${{ github.sha }}
        run: |
          echo "Verifying Frontend image..."
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }} || \
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }}-${{ github.sha }}


          if [ $? -ne 0 ]; then
            echo "Docker image push failed."
            exit 1
          else
            echo "All Docker images pushed successfully."
          fi

  # Update the Docker image tags in the GitOps repository
  update_docker_image_tags_in_gitops_repo:
    name: Update Docker Image Tags in GitOps Repository
    runs-on: ubuntu-latest
    needs: build_and_push_docker_images
    permissions:
      contents: write
      id-token: write

    steps:
      # Update the Docker image tags in the GitOps repository
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Pavan-Kumar-Adapala/gitops-portfolio-3d-k8s
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Docker image tags in deployment.yaml
        run: |
          # Update Frontend image
          sed -i "s|\(image:\s*\)adapaladocker/personal_portfolio_3d:[^[:space:]]*|\1adapaladocker/personal_portfolio_3d:${{ github.ref_name }}-${{ github.sha }}|" k8s/deployment.yaml

          # Update Backend image
          sed -i "s|\(image:\s*\)adapaladocker/portfolio_backend:[^[:space:]]*|\1adapaladocker/portfolio_backend:${{ github.ref_name }}-${{ github.sha }}|" k8s/deployment.yaml

      # Commit and push changes
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update Docker image tag & NODE_ENV for branch ${{ github.ref_name }}"
          git push origin ${{ github.ref_name }}

      - name: Check if the push was successful
        run: |
          if [ $? -ne 0 ]; then
            echo "Failed to push changes to GitOps repository."
            exit 1
          else
            echo "Changes pushed successfully to GitOps repository."
          fi

