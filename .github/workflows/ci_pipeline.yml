  # Docker image vulnerability scanning for Frontend
  build_frontend_docker_image_and_scan_for_vulnerabilities:
    name: Docker Image build and Vulnerability Scanning and Push (Frontend)
    runs-on: ubuntu-latest
    needs: static_code_analysis
    permissions:
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image (but do not push yet)
      - name: Build Docker image (Frontend)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          # ${{ github.ref_name }}
          # ${{ github.ref_name }}-${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }} 
            ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }}-${{ github.sha }}

      # Scan the Docker image for vulnerabilities before pushing
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL" # HIGH,MEDIUM,LOW
          exit-code: "0" # 1 to fail the job if vulnerabilities are found
          ignore-unfixed: true # Ignore unfixed vulnerabilities

      # - name: View SARIF contents
      #   run: cat trivy-results.sarif

      # Upload the Trivy scan results
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Push Frontend Docker image to Docker Hub
      - name: Push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/personal_portfolio_3d:${{ github.ref_name }}-${{ github.sha }}

