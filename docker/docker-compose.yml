# Docker Compose file for the RAG System with Ollama, Frontend
services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434" 
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"] 
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - chatbot-network

  ollama-init:
    image: ollama/ollama
    container_name: ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.1:latest}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-qwen3-embedding:4b}
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Ollama server...';
        until curl -sf http://ollama:11434/api/tags; do sleep 3; done;
        echo 'Pulling LLM model: $LLM_MODEL';
        ollama pull $LLM_MODEL;
        echo 'Pulling embedding model: $EMBEDDINGS_MODEL';
        ollama pull $EMBEDDINGS_MODEL;
        echo 'All models ready.';
      "
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: "no"
 
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.rag
    container_name: rag_backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.1:latest} 
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-qwen3-embedding:4b}
    volumes:
      - chroma_data:/rag/db/chroma_db
      - tracker_data:/rag/db
      - ../pdf_documents_folder:/rag/pdf_documents_folder:ro
      - ../logs:/rag/logs
    networks:
      - chatbot-network
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    environment:
      - RAG_API_SERVER_URL=${RAG_API_SERVER_URL:-http://localhost:8000}
    restart: unless-stopped
    networks:
      - chatbot-network
volumes:
  ollama_data:
  chroma_data:
  tracker_data:
networks:
  chatbot-network: