services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: portfolio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - portfolio-network

  # Backend - FastAPI Service
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
      - CORS_ORIGINS=*
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - portfolio-network
    restart: unless-stopped

  # Frontend - Vite Development Server
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    container_name: portfolio-frontend
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - portfolio-network
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  portfolio-network:
    driver: bridge
